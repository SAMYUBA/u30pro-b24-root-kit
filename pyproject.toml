[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"] # Tests explicitly load standalone CLI modules.

[tool.mypy]
python_version = "3.11"
mypy_path = "scripts"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "avbtool"
ignore_missing_imports = true # Separately acquired, hash-pinned local upstream module.

[tool.pytest.ini_options]
testpaths = ["tests"]
